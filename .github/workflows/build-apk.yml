      - name: Build the APK
        working-directory: app-src
        run: gradle assembleDebug --stacktrace

      - name: Name the APK MDSportLive
        run: cp app-src/app/build/outputs/apk/debug/app-debug.apk app-src/MDSportLive.apk

      - name: Save the APK as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: MDSportLive-apk
          path: app-src/MDSportLive.apk

      - name: Publish the APK as a release (easy download on a phone)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MDSportLive build ${{ github.run_number }}
          files: app-src/MDSportLive.apk
